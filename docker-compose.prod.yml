services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file: .env
        volumes:
            - ./.env:/var/www/html/.env
            - app-storage:/var/www/html/storage
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - './public:/var/www/html/public:ro'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            - app

    pgsql:
        image: 'postgis/postgis:17-3.5-alpine'
        restart: unless-stopped
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/pgsql/enable-postgis.sql:/docker-entrypoint-initdb.d/20-enable-postgis.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        restart: unless-stopped
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

networks:
    sail:
        driver: bridge

volumes:
    app-storage:
        driver: local
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
