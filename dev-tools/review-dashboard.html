<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propwise — Dev Review Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .finding-card { transition: opacity 0.15s ease; }
    .finding-card.dismissed { opacity: 0.45; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-mono text-sm" x-data="dashboard()" x-cloak>

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div>
      <h1 class="text-lg font-bold text-white tracking-tight">Propwise — Dev Review</h1>
      <p class="text-gray-500 text-xs mt-0.5" x-text="'Generated ' + RESULTS.generated_at"></p>
    </div>
    <div class="flex items-center gap-4">
      <!-- Global stats -->
      <template x-for="sev in ['critical','high','medium','low']" :key="sev">
        <span class="flex items-center gap-1.5 text-xs px-2 py-1 rounded"
              :class="severityBg(sev)">
          <span x-text="globalStats[sev]"></span>
          <span x-text="sev" class="uppercase tracking-wider opacity-80"></span>
        </span>
      </template>
      <button @click="clearAll()" class="text-xs text-gray-600 hover:text-gray-400 ml-2">reset</button>
    </div>
  </header>

  <div class="flex h-[calc(100vh-65px)]">

    <!-- Sidebar nav -->
    <nav class="w-48 border-r border-gray-800 bg-gray-900 flex-shrink-0 p-3 space-y-1">
      <template x-for="tab in tabs" :key="tab.id">
        <button
          @click="activeTab = tab.id"
          class="w-full text-left px-3 py-2 rounded text-xs flex items-center justify-between group"
          :class="activeTab === tab.id ? 'bg-gray-700 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'"
        >
          <div class="flex items-center gap-2">
            <span x-text="tab.icon"></span>
            <span x-text="tab.label"></span>
          </div>
          <span class="text-gray-500 group-hover:text-gray-400 text-xs" x-text="tabFindingCount(tab.id)"></span>
        </button>
      </template>

      <div class="pt-4 border-t border-gray-800 space-y-1">
        <p class="text-gray-600 text-xs px-3 pb-1 uppercase tracking-wider">Filter</p>
        <template x-for="sev in ['critical','high','medium','low']" :key="sev">
          <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer hover:bg-gray-800">
            <input type="checkbox" :value="sev" x-model="activeSeverities" class="rounded" />
            <span class="text-xs flex-1" x-text="sev"></span>
            <span class="w-2 h-2 rounded-full" :class="severityDot(sev)"></span>
          </label>
        </template>
        <label class="flex items-center gap-2 px-3 py-1.5 rounded cursor-pointer hover:bg-gray-800 mt-2">
          <input type="checkbox" x-model="showDismissed" class="rounded" />
          <span class="text-xs text-gray-500">show dismissed</span>
        </label>
      </div>
    </nav>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto p-6 space-y-4">

      <!-- Summary banner -->
      <template x-if="currentData">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 text-gray-300 text-xs leading-relaxed" x-text="currentData.summary"></div>
      </template>

      <!-- Findings -->
      <template x-if="currentData">
        <div class="space-y-3">
          <template x-if="filteredFindings.length === 0">
            <p class="text-gray-600 text-center py-12">No findings match the current filter.</p>
          </template>
          <template x-for="finding in filteredFindings" :key="finding.id">
            <div class="finding-card border rounded-lg overflow-hidden"
                 :class="[isDismissed(finding.id) ? 'dismissed border-gray-800' : 'border-gray-700', severityBorder(finding.severity)]">
              <div class="flex items-start gap-3 p-4">
                <!-- Dismiss checkbox -->
                <input type="checkbox"
                       :checked="isDismissed(finding.id)"
                       @change="toggleDismiss(finding.id)"
                       class="mt-0.5 flex-shrink-0 cursor-pointer"
                       title="Mark as addressed" />

                <div class="flex-1 min-w-0">
                  <!-- Title row -->
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs px-2 py-0.5 rounded font-medium uppercase tracking-wider"
                          :class="severityBg(finding.severity)"
                          x-text="finding.severity"></span>
                    <span class="text-xs px-2 py-0.5 rounded bg-gray-800 text-gray-400"
                          x-text="finding.category"></span>
                    <span class="text-xs text-gray-500" x-text="finding.id"></span>
                    <h3 class="text-white font-semibold text-sm ml-1" x-text="finding.title"></h3>
                  </div>

                  <!-- Location -->
                  <p class="text-gray-500 text-xs mt-1.5 font-mono" x-text="finding.location"></p>

                  <!-- Description -->
                  <p class="text-gray-300 text-xs mt-2 leading-relaxed" x-text="finding.description"></p>

                  <!-- Recommendation -->
                  <div class="mt-3 bg-gray-900 rounded p-3 border-l-2 border-blue-600">
                    <p class="text-gray-500 text-xs uppercase tracking-wider mb-1">Recommendation</p>
                    <p class="text-blue-300 text-xs leading-relaxed" x-text="finding.recommendation"></p>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Loading state -->
      <template x-if="!currentData">
        <div class="text-center py-24 text-gray-600">
          <p class="text-4xl mb-4">⏳</p>
          <p>Results not yet loaded for this agent.</p>
        </div>
      </template>

    </main>

    <!-- Right panel: addressed items -->
    <aside class="w-56 border-l border-gray-800 bg-gray-900 flex-shrink-0 p-3 overflow-y-auto">
      <p class="text-gray-500 text-xs uppercase tracking-wider px-3 pb-3">Addressed</p>
      <template x-if="addressedItems.length === 0">
        <p class="text-gray-700 text-xs px-3">None yet — check off findings to track progress.</p>
      </template>
      <template x-for="item in addressedItems" :key="item.id">
        <div class="px-3 py-2 rounded hover:bg-gray-800 group">
          <div class="flex items-start gap-2">
            <span class="text-xs mt-0.5" :class="severityDotText(item.severity)" x-text="'●'"></span>
            <div class="flex-1 min-w-0">
              <p class="text-gray-400 text-xs leading-tight line-clamp-2" x-text="item.title"></p>
              <p class="text-gray-700 text-xs mt-0.5" x-text="item.id"></p>
            </div>
            <button @click="toggleDismiss(item.id)" class="opacity-0 group-hover:opacity-100 text-gray-600 hover:text-gray-400 text-xs">✕</button>
          </div>
        </div>
      </template>

      <div class="mt-6 pt-4 border-t border-gray-800 px-3 space-y-2">
        <p class="text-gray-600 text-xs" x-text="addressedItems.length + ' of ' + totalFindings + ' addressed'"></p>
        <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden">
          <div class="h-full bg-green-600 rounded-full transition-all"
               :style="'width: ' + (totalFindings ? Math.round(addressedItems.length / totalFindings * 100) : 0) + '%'"></div>
        </div>
      </div>
    </aside>

  </div>

<script>
// ─── RESULTS DATA ──────────────────────────────────────────────────────────────
const RESULTS = {"generated_at": "2026-06-21 — Iteration 1", "qa": {"summary": "The codebase is generally well-structured with good separation of concerns, but has several meaningful gaps: postcode input is not format-validated (only length-capped), the date range validation has a subtle ordering dependency that breaks when only one date is supplied, the address field in PropertySaleResource silently drops SAON (flat/unit number), sale history in attachSaleHistory uses a per-item OR-query that grows unboundedly with page size, CrimeDataService makes up to 24 sequential HTTP calls per request with no rate-limit handling or failure isolation, the frontend fires summary and crime-comparison requests sequentially (not in parallel) and does not cancel stale in-flight requests on rapid re-search, and the test suite lacks coverage for the area-summary and crime-comparison endpoints entirely.", "findings": [{"id": "qa-1", "title": "Postcode format not validated — any 8-char string accepted", "severity": "high", "category": "validation", "description": "SearchRequest only enforces max:8 on the postcode field. Any alphanumeric string up to 8 characters passes validation and reaches PostcodeLookupService, which normalises (uppercases, strips spaces) and queries the DB. Malformed values like '12345678' or 'AAAAAAAA' silently return 404 rather than 422, degrading the user experience and wasting a DB round-trip. The same gap exists in AreaSummaryController and CrimeComparisonController which use inline validate() with only 'required|string|max:8'.", "location": "app/Http/Requests/SearchRequest.php:17, app/Http/Controllers/Api/AreaSummaryController.php:23, app/Http/Controllers/Api/CrimeComparisonController.php:20", "recommendation": "Add a regex rule: regex:/^[A-Z]{1,2}[0-9][0-9A-Z]?\\s?[0-9][A-Z]{2}$/i to SearchRequest and extract a shared PostcodeRequest (or rule object) so AreaSummary and CrimeComparison use the same constraint."}, {"id": "qa-2", "title": "date_from/date_to cross-field validation silently breaks when only one date supplied", "severity": "medium", "category": "validation", "description": "The rule 'date_from' => ['sometimes', 'date', 'before_or_equal:date_to'] only fires when date_from is present, and before_or_equal:date_to only evaluates when date_to is also present. If a user sends only date_from (no date_to), the rule passes. In the repository, soldBetween is called with dateFrom and falls back to now()->toDateString() for dateTo — that is fine. But if only date_to is sent (no date_from), soldBetween is never applied (the when() guard on dateFrom evaluates false), so date_to is silently ignored — a confusing UX.", "location": "app/Http/Requests/SearchRequest.php:22-23, app/Repositories/PropertySaleRepository.php:18", "recommendation": "Either require both dates together (use required_with) or make soldBetween handle a half-open range (date_to without date_from should still filter). Add a test for each partial-date scenario."}, {"id": "qa-3", "title": "PropertySaleResource drops SAON — flat numbers silently omitted from address", "severity": "medium", "category": "data-integrity", "description": "The address field is built as trim(\"{$this->paon} {$this->street}\"), which omits saon entirely. For flats and properties with a secondary addressable object name (e.g. 'Flat 3', 'Ground Floor'), the displayed address is ambiguous or wrong. Two distinct flats at the same PAON/street will both appear as '12 Oak Street'.", "location": "app/Http/Resources/PropertySaleResource.php:14", "recommendation": "Prepend saon when present: trim(implode(' ', array_filter([$this->saon, $this->paon, $this->street])))."}, {"id": "qa-4", "title": "attachSaleHistory builds an unbounded OR-query — N conditions for N page items", "severity": "high", "category": "edge-case", "description": "attachSaleHistory iterates every item on the current page (up to 25) and wraps each one in an orWhere closure, producing a WHERE with up to 25 OR branches, each with 3-4 conditions. This works but is fragile: (1) it re-queries the full history for every visible property, not just those with sale_count > 1, so single-sale properties waste query work; (2) with dense urban postcodes all within radius, 25 OR groups with multi-column predicates can be slow on a large table without a composite index; (3) if the page size is ever increased, the query grows linearly.", "location": "app/Repositories/PropertySaleRepository.php:41-69", "recommendation": "Filter the items list to sale_count > 1 before building the OR query. Consider collecting (paon, postcode) pairs and using a VALUES list or a single IN on a generated key column to reduce query complexity."}, {"id": "qa-5", "title": "CrimeDataService makes up to 24 sequential HTTP calls per request with no timeout budget", "severity": "high", "category": "edge-case", "description": "getSummary() loops 12 months and fetchNeighbourhoodCrimeCounts() loops another 12 months. Each iteration calls Cache::remember with an HTTP::timeout(10) inside. In the worst case (cold cache) this is 24 sequential 10-second HTTP calls, giving a theoretical worst-case wall time of 240 seconds per cold request — far exceeding any reasonable PHP-FPM or nginx timeout. The crime-comparison endpoint chains locateNeighbourhood + getNeighbourhoodMeta + getNeighbourhoodBoundary + 12 monthly fetches, totalling up to 15 additional calls.", "location": "app/Services/CrimeDataService.php:20-46, 135-158", "recommendation": "Dispatch the 12 monthly fetches as concurrent HTTP::pool() calls. For the comparison endpoint, also pipeline the locate/meta/boundary fetches. Add a global request-level timeout guard so the endpoint fails fast and returns 503 rather than blocking."}, {"id": "qa-6", "title": "Cache::remember caches null on API failure — negative result gets 7-day TTL", "severity": "medium", "category": "data-integrity", "description": "locateNeighbourhood, getNeighbourhoodMeta, and getNeighbourhoodBoundary all return null on HTTP failure and store null in the cache with META_TTL (7 days). A transient police API outage will cause neighbourhood comparison to return 503 for 7 days for affected coordinates, even after the API recovers.", "location": "app/Services/CrimeDataService.php:87-93, 100-115, 121-132", "recommendation": "Only cache successful results. On failure return null without caching (use Cache::get + Cache::put only on success, or use a shorter negative-cache TTL of a few minutes)."}, {"id": "qa-7", "title": "Frontend fires summary and crime-comparison fetches sequentially; no AbortController", "severity": "medium", "category": "frontend", "description": "In app.js the summary and comparison fetches are awaited sequentially after the search resolves. The comparison only starts after summaryPromise resolves, making the total latency additive. More critically, if the user submits a second search before the first summary/comparison resolves, there is no AbortController or request-cancellation mechanism — stale responses can overwrite current state.", "location": "resources/js/app.js:56-116", "recommendation": "Kick off all three fetches simultaneously (Promise.allSettled or independent awaits in parallel) and use AbortController to cancel in-flight requests when a new search starts."}, {"id": "qa-8", "title": "No test coverage for /api/area-summary or /api/crime-comparison endpoints", "severity": "high", "category": "test-coverage", "description": "The feature test suite covers SearchController thoroughly but there are no tests for AreaSummaryController or CrimeComparisonController. Scenarios untested include: postcode not found (404), police API unavailable (503 from CrimeComparison), successful response structure, and the postcode normalisation path shared with SearchController.", "location": "tests/Feature/Api/SearchControllerTest.php", "recommendation": "Add AreaSummaryControllerTest and CrimeComparisonControllerTest. Use Http::fake() to stub police.uk API responses. Test the 404, 503, and 200 paths with correct JSON structure assertions."}, {"id": "qa-9", "title": "No test for postcode normalisation — mixed-case or spaced postcodes untested", "severity": "low", "category": "test-coverage", "description": "PostcodeLookupService normalises input (uppercase + strip spaces). The tests only call with 'SW1A1AA' (already normalised). There is no test confirming that 'sw1a 1aa' or 'Sw1A 1Aa' resolve correctly, nor that the Postcode model primary key lookup is case-insensitive in Postgres.", "location": "tests/Feature/Api/SearchControllerTest.php, app/Services/PostcodeLookupService.php:14", "recommendation": "Add a feature test that posts a mixed-case spaced postcode and asserts 200, and a unit test for PostcodeLookupService::lookup() normalisation logic."}, {"id": "qa-10", "title": "Pagination page parameter not validated — negative or non-integer page accepted", "severity": "low", "category": "validation", "description": "The search endpoint uses Laravel's default paginate(25), which accepts the 'page' query parameter without any validation in SearchRequest. Passing page=0, page=-1, or page=abc either throws an exception or returns an empty result silently. The frontend always sends a numeric page, but the API is publicly addressable.", "location": "app/Http/Requests/SearchRequest.php, app/Repositories/PropertySaleRepository.php:34", "recommendation": "Add 'page' => ['sometimes', 'integer', 'min:1'] to SearchRequest rules."}, {"id": "qa-11", "title": "sale_date cast assumed non-null in resource — will throw 500 if null in DB", "severity": "medium", "category": "data-integrity", "description": "PropertySaleResource calls $this->sale_date->toDateString() (line 18) and the sale_history mapper also calls $h->sale_date->toDateString() (line 33). Both assume sale_date is a non-null Carbon instance. If any row in property_sales has a null sale_date (possible from malformed ETL imports), this will throw a fatal error and return a 500 with no useful message.", "location": "app/Http/Resources/PropertySaleResource.php:18,33", "recommendation": "Add a database NOT NULL constraint on sale_date if not already present, and/or use $this->sale_date?->toDateString() defensively in the resource. Add a null sale_date scenario to the repository test."}, {"id": "qa-12", "title": "tupleKey collision risk: pipe character in paon/saon could produce false matches", "severity": "low", "category": "data-integrity", "description": "tupleKey() concatenates fields with '|' as separator: paon . '|' . (saon ?? '') . '|' . (street ?? '') . '|' . postcode. If paon or saon itself contains a pipe character (unlikely but possible in raw Land Registry data), two distinct addresses could produce the same key, causing wrong sale history to be attached.", "location": "app/Repositories/PropertySaleRepository.php:72-75", "recommendation": "Use a separator that cannot appear in address data, or JSON-encode the tuple: json_encode([$row->paon, $row->saon, $row->street, $row->postcode])."}, {"id": "qa-13", "title": "property_type[] accepted as empty array — no minimum items validation", "severity": "low", "category": "validation", "description": "The rule 'property_type' => ['sometimes', 'array'] allows an empty array to be submitted. The when() guard in the repository uses truthiness of the array, so an empty array evaluates falsy and the filter is skipped — which returns all types. This is probably the desired behaviour but it is implicit and untested.", "location": "app/Http/Requests/SearchRequest.php:20, app/Repositories/PropertySaleRepository.php:17", "recommendation": "Either add 'min:1' to the array rule to reject empty arrays explicitly, or add a test documenting and asserting the empty-array-means-all behaviour."}, {"id": "qa-14", "title": "Miles-to-metres constant duplicated in two places", "severity": "low", "category": "frontend", "description": "PropertySale::scopeWithinRadius() and formatDistance() in app.js both independently hardcode 1609.34 metres-per-mile. If the constant ever needs adjustment it must be changed in both places. This is a maintenance hazard rather than a functional bug.", "location": "app/Models/PropertySale.php:33, resources/js/app.js:129", "recommendation": "Minor: expose the miles-to-metres conversion as a shared config value or derive it server-side and return distance_miles in the API response alongside distance_metres."}], "stats": {"critical": 0, "high": 4, "medium": 5, "low": 5}}, "security": {"summary": "Propwise is a Laravel 13 application with a Python ETL pipeline. The overall security posture is reasonable for an early-stage project: no hardcoded production secrets were found in committed code, APP_DEBUG is correctly set to false in the production example, and raw SQL usage consistently uses parameterised bindings. The primary concerns are: Telescope is installed and its gate has an empty allowlist, making /telescope accessible to any authenticated user in production; all three API endpoints lack rate limiting, making them trivially abusable; Redis has no password configured, leaving the session store and cache unprotected within the Docker network; the nginx config only listens on HTTP with no HTTPS/HSTS; the deploy script runs git pull on the production server alongside image-based deployment, which is an inconsistent and risky pattern; and the ETL config.py has a hardcoded fallback password of 'password' that will silently be used if the env var is absent.", "findings": [{"id": "sec-1", "title": "Telescope dashboard accessible with empty allowlist gate", "severity": "high", "category": "auth", "description": "TelescopeServiceProvider defines the viewTelescope gate with an empty email array. Since authentication is deferred and no auth middleware wraps the /telescope route, any authenticated user gains full access once auth is added. The Telescope UI exposes full request payloads, query bindings, job contents, and cache values. Even before auth is wired up, /telescope returns a page that fingerprints the stack.", "location": "app/Providers/TelescopeServiceProvider.php:59", "recommendation": "Either disable Telescope entirely in production by wrapping its registration in $this->app->environment('local'), or populate the gate's email array with specific admin addresses. Consider adding the TELESCOPE_ENABLED env var guard from the Telescope docs."}, {"id": "sec-2", "title": "No rate limiting on any API endpoint", "severity": "high", "category": "rate-limiting", "description": "All three API routes (/api/search, /api/area-summary, /api/crime-comparison) have no throttle middleware. Each request can trigger PostGIS spatial queries and up to 12 outbound HTTP calls to data.police.uk. There is no default throttle applied in bootstrap/app.php either. An unauthenticated caller can exhaust the police API rate limit, saturate the DB connection pool, or run up cloud hosting costs with no friction.", "location": "routes/api.php:8-10 and bootstrap/app.php:18-21", "recommendation": "Add throttle middleware to the API route group. A reasonable starting point is Route::middleware('throttle:60,1')->group(...) for the search endpoint and throttle:20,1 for the crime endpoints which are heavier."}, {"id": "sec-3", "title": "Redis has no password — session store and cache unprotected", "severity": "high", "category": "config", "description": "Both .env.example and .env.production.example set REDIS_PASSWORD=null. The production stack uses Redis for both SESSION_DRIVER and CACHE_STORE. Any process on the Docker sail bridge network can connect to Redis and read or forge session tokens, poison the crime/neighbourhood cache, or issue a FLUSHALL.", "location": ".env.production.example:43 and docker-compose.prod.yml:57-68", "recommendation": "Set a strong random REDIS_PASSWORD in the production .env, configure the redis service with requirepass in its command or a redis.conf volume, and update REDIS_PASSWORD in the Laravel env to match. Update the example file to show REDIS_PASSWORD=CHANGE_ME rather than null."}, {"id": "sec-4", "title": "No HTTPS — nginx only listens on HTTP 80", "severity": "high", "category": "deployment", "description": "The nginx config (docker/nginx/default.conf) only defines a server block on port 80 with no TLS configuration, no redirect from HTTP to HTTPS, and no Strict-Transport-Security header. Sessions use Redis as the driver, and the session cookie will be transmitted in cleartext.", "location": "docker/nginx/default.conf and docker-compose.prod.yml:22-23", "recommendation": "Add a second server block for port 443 with SSL certificate paths (Let's Encrypt via certbot or Caddy as a reverse proxy). Add a 301 redirect from port 80 to HTTPS. Add the Strict-Transport-Security header with at least max-age=31536000. Also add SESSION_SECURE_COOKIE=true to the production env."}, {"id": "sec-5", "title": "Hardcoded fallback password 'password' in ETL config", "severity": "medium", "category": "secrets", "description": "etl/config.py line 12 sets DB_PASSWORD = os.getenv('DB_PASSWORD', 'password'). If the .env file is absent or DB_PASSWORD is unset when a Python ETL script runs, it silently falls back to 'password' and attempts to connect. This provides false confidence — a misconfigured environment connects with a weak credential rather than failing loudly. The same pattern appears for DB_USER defaulting to 'sail'.", "location": "etl/config.py:11-12", "recommendation": "Remove the default values for DB_PASSWORD and DB_USER. Use os.environ['DB_PASSWORD'] (no default) so the script raises a KeyError immediately if the credential is missing, forcing explicit configuration."}, {"id": "sec-6", "title": "git pull in deploy script puts source code on production server", "severity": "medium", "category": "deployment", "description": "The deploy workflow SSHs into the droplet and runs git pull origin master before pulling and launching the pre-built Docker image. This means the production server has a clone of the repository with the full source code, .env.production.example, docker-compose.prod.yml, and nginx config checked out. If the application container is ever compromised or the server is accessed, the attacker has the full source and deployment config in the working directory.", "location": ".github/workflows/deploy.yml:64", "recommendation": "Decide on one deployment model. For image-based deployment, ship all config files inside the image or via a separate config management step. Remove the git pull and embed a specific image tag in the deploy script that matches the built image SHA."}, {"id": "sec-7", "title": "trustProxies set to wildcard '*'", "severity": "medium", "category": "config", "description": "bootstrap/app.php sets $middleware->trustProxies(at: ['*']), which trusts all proxies unconditionally. This means any client can spoof X-Forwarded-For, X-Forwarded-Proto, X-Forwarded-Host, and related headers. If rate limiting is added, it would be trivially bypassed by spoofing X-Forwarded-For.", "location": "bootstrap/app.php:19", "recommendation": "Replace ['*'] with the specific IP address or CIDR block of your upstream proxy (e.g. the nginx container gateway address or a load balancer IP). If nginx is in the same Docker network, use the Docker network subnet or the nginx service IP."}, {"id": "sec-8", "title": "Missing security headers: HSTS, CSP, Referrer-Policy", "severity": "low", "category": "deployment", "description": "The nginx config sets X-Frame-Options and X-Content-Type-Options, but is missing Strict-Transport-Security (HSTS), Content-Security-Policy, Referrer-Policy, and Permissions-Policy. The absence of CSP is notable given the app uses Alpine.js and makes XHR calls to the same-origin API — a permissive default allows any inline script execution if XSS were introduced.", "location": "docker/nginx/default.conf:7-8", "recommendation": "Add at minimum: Strict-Transport-Security 'max-age=31536000; includeSubDomains', Referrer-Policy 'strict-origin-when-cross-origin', and a restrictive Content-Security-Policy starting with default-src 'self'."}, {"id": "sec-9", "title": "SESSION_ENCRYPT=false in production example", "severity": "low", "category": "config", "description": "The .env.production.example explicitly sets SESSION_ENCRYPT=false. While Redis session storage means the session data is not stored client-side, enabling session encryption adds a layer of protection if Redis is ever readable by an unintended party. Given that auth is planned, session data will eventually contain user identity.", "location": ".env.production.example:29", "recommendation": "Set SESSION_ENCRYPT=true in the production example. The performance overhead is negligible and it provides defence-in-depth against Redis exposure."}, {"id": "sec-10", "title": "Cache keys use raw float coordinates — unbounded cache key space", "severity": "low", "category": "injection", "description": "CrimeDataService constructs cache keys like crime:{$lat}:{$lng}:{$month} using floats passed directly from the postcode lookup. Since coordinates come from the DB (not user input) this is low risk currently, but the cache key space is unbounded — any distinct float representation creates a new key.", "location": "app/Services/CrimeDataService.php:24 and 85", "recommendation": "Normalise coordinates to a fixed precision (e.g. 4 decimal places, ~11m resolution) before building cache keys: number_format($lat, 4). This also makes cache hit rates more predictable."}], "stats": {"critical": 0, "high": 4, "medium": 3, "low": 3}}, "adversarial": {"summary": "Propwise is a weekend-project-grade MVP masquerading as a property analytics tool. It wraps freely available public data (Land Registry Price Paid, EPC register, data.police.uk, GIAS) in a single-page postcode search with zero differentiation from what Rightmove, Zoopla, and HouseMetric already offer for free — and does it worse. There is no auth, no monetisation plan, no saved searches, no alerts, no AVM, no listings integration, and no map. The entire product is a single input field and a flat list. The architecture is technically coherent for a solo Laravel project but will hit a wall at any meaningful traffic volume on a $12 DO droplet with a 29M-row PostGIS table and no query caching. EPC coverage is patchy by the developer's own admission, Ofsted ratings were removed from GIAS in Jan 2025 leaving the schools panel toothless, and the crime data is drawn from an unauthenticated third-party API with a 24h cache that will silently return stale or missing data.", "findings": [{"id": "adv-1", "title": "No differentiation from free alternatives", "severity": "critical", "category": "business", "description": "Every data source used — Land Registry Price Paid, EPC register, data.police.uk, GIAS schools — is free, public, and already surfaced better by Rightmove, Zoopla, and HouseMetric. Rightmove's sold prices page gives the same postcode radius search with a map, photos, and listing context. HouseMetric gives price trend charts and heatmaps. The core value proposition is indistinguishable from free tools that have millions of users, established SEO, and mobile apps.", "location": "Product overall", "recommendation": "Identify one defensible insight that none of the free tools expose — composite affordability index, rental yield modelling from LR + census data, planning application overlays, flood risk correlation with price decay. Build around that, not around repackaging public data."}, {"id": "adv-2", "title": "No map view — fatal UX gap", "severity": "critical", "category": "product", "description": "The entire results UI is a flat list sorted by distance with no map. Property search is inherently spatial. Users need to see where sold properties cluster, where crime hotspots sit relative to results, and where schools are. Distance in metres from a postcode centroid is meaningless without visual context. Competitors have had interactive maps for over a decade. This is listed as a future feature but the product should not have launched without it.", "location": "resources/views/home.blade.php — results list", "recommendation": "Integrate Leaflet.js (already planned) before any other feature work. Pin sold properties, colour-code by price/sqm, overlay crime heatmap. This is table stakes, not a nice-to-have."}, {"id": "adv-3", "title": "Schools panel factually incomplete — Ofsted removed from GIAS Jan 2025", "severity": "critical", "category": "data", "description": "Ofsted ratings were removed from GIAS in January 2025. The schools panel shows name, phase, and distance — but no Ofsted rating. This is the primary signal parents use when evaluating school proximity. Showing a list of school names with phases but no quality signal is actively misleading: a parent seeing 'St Mary's Primary — 0.3mi' with no rating gets less value than a Google Maps search.", "location": "resources/views/home.blade.php — schools panel", "recommendation": "Either source Ofsted ratings directly from the Ofsted API (inspection outcomes are published via their data portal) or remove the schools panel until it can show quality data. A list of names and distances without ratings is noise."}, {"id": "adv-4", "title": "EPC match rate unknown — price/sqm likely blank for most results", "severity": "high", "category": "data", "description": "EPC certificates only exist for properties assessed since 1985, with mandatory assessment only triggered by a sale or rental since 2008. The match pipeline uses exact then fuzzy (pg_trgm threshold 0.6). If 60-70% of records return no EPC (likely for older housing stock and pre-2008 sales), the floor area and price/sqm columns — the most analytically useful fields — will be blank for the majority of results.", "location": "app/Http/Resources/PropertySaleResource.php, app/Repositories/PropertySaleRepository.php", "recommendation": "Run a match rate analysis before launch: SELECT epc_match_confidence, COUNT(*) FROM property_sales GROUP BY epc_match_confidence. If exact+fuzzy match rate is below 40%, reconsider how prominently floor area and price/sqm are displayed."}, {"id": "adv-5", "title": "29M-row PostGIS queries on a $12 DO droplet with no result caching", "severity": "high", "category": "architecture", "description": "The search query uses ST_Distance with a geography cast, two window functions (ROW_NUMBER and COUNT OVER PARTITION), a subquery, eager loading of EpcCertificate, and then a separate N+1-pattern attachSaleHistory query. On a 2GB RAM droplet with no query result caching, any concurrent usage will cause Postgres to spill to disk. The location column UPDATE already took several hours — that's a signal about the hardware's capability.", "location": "app/Repositories/PropertySaleRepository.php", "recommendation": "Add Redis caching for search results keyed on the full parameter set (postcode + radius + filters + page). Add a read replica before any real traffic. Restructure attachSaleHistory to use a CTE. Consider pre-aggregating sale history into a JSONB column at ETL time."}, {"id": "adv-6", "title": "No auth, no saved searches — nothing to retain users", "severity": "high", "category": "business", "description": "Phase 4 is where auth appears. Until then, there is no saved search, no alert when a new sale matches a user's criteria, no favourites, no comparison view, no shareable URL. Every session starts cold. Users who find the tool useful have no mechanism to return to it and no reason to share it. Property researchers check the same areas repeatedly over weeks or months — without saved searches and email alerts this tool cannot serve that use case.", "location": "Product overall — no auth routes in routes/api.php", "recommendation": "Even a minimal email-only auth with saved searches and a weekly digest would create retention loops. Build this before any new data feature."}, {"id": "adv-7", "title": "crime-comparison endpoint slow on first call with no fallback", "severity": "high", "category": "architecture", "description": "The crime comparison loads via a separate async fetch to /api/crime-comparison which POSTs to data.police.uk to get a neighbourhood boundary polygon. This is slow on first call, cached for 24h in Redis. If data.police.uk is unavailable (it has a history of downtime and rate limiting), the comparison silently shows 'Neighbourhood comparison unavailable' with no indication of why or when it will work.", "location": "resources/js/app.js — comparisonPromise, app/Services/CrimeDataService.php", "recommendation": "Cache neighbourhood boundaries for much longer (30 days minimum — they rarely change). Add a background job to pre-warm cache for popular postcodes. Add exponential backoff and a user-facing status indicator when the external API is degraded."}, {"id": "adv-8", "title": "Radius capped at 2 miles — useless for rural and suburban areas", "severity": "high", "category": "product", "description": "The maximum search radius is 2 miles. In rural areas, comparable sales may not exist within 2 miles. Estate agents and surveyors routinely use 5-10 mile comparable radii for valuation purposes. The UI offers 0.5, 1, and 2 mile options. This makes the tool useless for anyone outside a dense urban area.", "location": "resources/views/home.blade.php — radius select", "recommendation": "Add 5 and 10 mile options to the radius select. The PostGIS query can handle it; the concern is result volume, but pagination handles that. Consider adding a result count feedback ('3 results — try expanding your radius') to guide users when results are sparse."}, {"id": "adv-9", "title": "No price trend or time-series analysis — most compelling feature absent", "severity": "high", "category": "product", "description": "The most valuable question a property researcher asks is 'is this area going up or down?' The current UI shows a list of individual sales with no aggregate statistics, no median price, no trend line, no year-on-year change. With 29 million records dating back to 1995, this is the most compelling analytical capability available — and it is entirely absent. This is listed as a future feature, meaning the product launched without its most compelling use case.", "location": "resources/views/home.blade.php — no summary stats panel", "recommendation": "Add a summary panel showing median sold price by year for the searched area, price/sqm trend, and number of transactions per quarter. This is a chart and two aggregate SQL queries. It should have been the first feature."}, {"id": "adv-10", "title": "Address construction is naive — flat numbers omitted from display", "severity": "high", "category": "data", "description": "The address shown to users is built as trim(\"{$this->paon} {$this->street}\") in PropertySaleResource. The Land Registry format includes SAON (Secondary Addressable Object Name — flat/unit number) which is dropped entirely, meaning 'Flat 3, 42 High Street' is displayed as '42 High Street', indistinguishable from the ground floor. For flats in converted houses this makes individual sale results unreliable.", "location": "app/Http/Resources/PropertySaleResource.php line 14", "recommendation": "Build address as: SAON (if present) + ', ' + PAON + ' ' + street. This changes 'Flat 3, 42 High Street' from '42 High Street' to 'Flat 3, 42 High Street'. Also display locality/district where town_city is missing."}, {"id": "adv-11", "title": "No shareable or bookmarkable search URLs", "severity": "medium", "category": "product", "description": "All search state is held in Alpine.js component data. The URL never changes when a search is performed. A user cannot bookmark a search, share it with a partner or colleague, or return to it via browser history. This is also a missed SEO opportunity — deep links for popular postcodes could drive organic traffic.", "location": "resources/js/app.js — search() function, no history.pushState()", "recommendation": "Push search params to URL query string via history.pushState() on each search. Read them on page load to restore state. This costs ~10 lines of JS and unlocks sharing, bookmarking, and back-button support."}, {"id": "adv-12", "title": "No mobile-optimised result layout", "severity": "medium", "category": "product", "description": "The layout is responsive via Tailwind breakpoints but the results card design packs address, town, postcode, price, date, badges, floor area, price/sqm, and distance into a single card with no hierarchy on mobile. On a 375px screen, users will not be able to scan results. Property search is increasingly mobile-first.", "location": "resources/views/home.blade.php — result card template", "recommendation": "Design mobile-first. Key hierarchy: address > price > date. Secondary: type, distance. Tertiary: floor area, price/sqm, EPC confidence. Consider collapsible detail rows on mobile."}, {"id": "adv-13", "title": "attachSaleHistory is N-query-equivalent at scale", "severity": "medium", "category": "tech-debt", "description": "attachSaleHistory builds a large OR-chained WHERE clause matching up to 25 property tuples. On each page load this fires an additional unbounded query that can return thousands of rows. The SQL query grows quadratically in complexity as each OR clause adds conditions on paon, saon, street, and postcode. This will cause query plan degradation under load.", "location": "app/Repositories/PropertySaleRepository.php — attachSaleHistory()", "recommendation": "Pre-materialise sale history as a JSONB column on property_sales at ETL time (group by address tuple, store array of historical prices). Eliminates the second query entirely."}, {"id": "adv-14", "title": "Single $12 DO droplet is not production-viable", "severity": "medium", "category": "architecture", "description": "The production target is a 2GB RAM Basic droplet running Docker with Postgres 17, PostGIS, Redis, PHP-FPM, and Nginx all on the same host. The LR location UPDATE already took several hours as a single transaction on this hardware. With 2GB total RAM, even a modest shared_buffers of 512MB leaves 1.5GB for everything else. A single slow radius query will cause OOM or query cancellation.", "location": "Deployment — docker-compose.prod.yml on $12 DO droplet", "recommendation": "Minimum viable production: $48 DO droplet (8GB RAM) for Postgres, separate $12 droplet for app + Redis. Or use DO Managed Postgres which handles failover and allows independent scaling."}, {"id": "adv-15", "title": "No monetisation model and no path to one", "severity": "medium", "category": "business", "description": "The product is entirely free with no auth and no monetisation. Phase 4 is listed as 'monetisation' with no details. Without a unique data asset or a B2B angle (estate agents, surveyors, mortgage brokers), the only monetisation routes are ads (low yield, degrades UX) or a freemium SaaS with paywalled features (requires auth, saved searches, and a differentiated paid tier). None of this is defined.", "location": "Business model — PROJECT_STATE.md open questions", "recommendation": "Define monetisation before Phase 4. The most credible B2B angle: automated valuation reports for estate agents or mortgage brokers (combines LR history + EPC + area summary into a PDF). This is a known paid product category with willing buyers."}, {"id": "adv-16", "title": "No SSL in production", "severity": "medium", "category": "architecture", "description": "PROJECT_STATE.md explicitly states 'SSL not yet configured'. The API receives postcodes (location data) over HTTP in plaintext. Browsers will show 'Not Secure'. Google will not index HTTP pages in 2026. Any user on a shared network is exposed. This is a blocker for any real usage.", "location": "Deployment — docker/nginx/default.conf", "recommendation": "Configure Certbot/Let's Encrypt before any public announcement. This is a 20-minute task once a domain is pointed at the droplet."}, {"id": "adv-17", "title": "Crime data uses incompatible geographies — radius vs neighbourhood polygon", "severity": "medium", "category": "data", "description": "The area crime counts are pulled using a 1-mile radius from the postcode centroid. The comparison column shows neighbourhood polygon counts. These are measuring fundamentally different geographies and should not be presented side-by-side as if comparable. A 1-mile circle from a boundary postcode will include crimes from the adjacent neighbourhood while excluding some from the user's own neighbourhood.", "location": "resources/views/home.blade.php — crime table, app/Services/CrimeDataService.php", "recommendation": "Either use the neighbourhood boundary consistently for both the area counts and comparison counts, or clearly label the columns 'Within 1 mile' vs 'Your neighbourhood' and add a tooltip explaining the methodology difference."}, {"id": "adv-18", "title": "Land Registry data quality issues not disclosed to users", "severity": "medium", "category": "data", "description": "Land Registry Price Paid data has documented quality issues: duplicate entries, prices that include fixtures/fittings or chattels not reflected in the register, and a 3-6 week lag from completion to registration. None of these caveats are disclosed to users. A user seeing a £95,000 sale in 2024 in London has no way to know if it's a genuine anomaly, a data error, or a transfer at below-market value.", "location": "Product overall — no data quality disclosures in UI", "recommendation": "Add a data disclosure footer explaining LR data lag (typically 2-3 months to completeness), known anomalies, and the exclusion of Category B records. Mark statistically anomalous prices (>3 standard deviations from local median) with a warning badge."}, {"id": "adv-19", "title": "No property detail page — sale history fetched but not rendered in UI", "severity": "medium", "category": "product", "description": "Each result card is a dead end. There is no clickable detail view, no full sale history display, no EPC certificate detail (band, energy efficiency score, recommendations), no direct link to the Land Registry entry. The saleHistory relation is fetched and serialised in the API response but never rendered in the UI. The data is being fetched and discarded.", "location": "resources/views/home.blade.php — result card, app/Http/Resources/PropertySaleResource.php — sale_history field", "recommendation": "Add a detail panel or modal per property showing full sale history as a timeline, EPC band and score, and a link to the LR title register. The data is already in the API response — wire it up."}, {"id": "adv-20", "title": "EPC auto-download not implemented — manual import is operationally fragile", "severity": "low", "category": "tech-debt", "description": "The EPC import requires a manually downloaded bulk CSV from epc.opendatacommunities.org. The ETL has no scheduled refresh for EPC data. EPC certificates are added continuously as properties are assessed. Without automation, EPC coverage will degrade over time relative to the fresh Land Registry data that is auto-imported monthly.", "location": "etl/import_epc.py, PROJECT_STATE.md — ingest:epc", "recommendation": "Automate EPC bulk download. The EPC register provides a bulk download API via epc.opendatacommunities.org — it requires registration but is free. Automate monthly re-download and delta import via the existing ingest:epc command."}, {"id": "adv-21", "title": "No analytics — no funnel visibility", "severity": "low", "category": "business", "description": "There is no analytics integration (no GA, no Plausible, no Fathom, no server-side event logging beyond Laravel Telescope in dev). The team has no visibility into which postcodes are searched most, where users drop off, which filters are used, or whether the area summary panels are read. Every product decision is a guess.", "location": "resources/views/layouts/app.blade.php — no analytics scripts", "recommendation": "Add Plausible or Fathom (privacy-first, GDPR-compliant, no cookie banner required) before launch. Tag the search event, filter interactions, and pagination clicks as custom events."}, {"id": "adv-22", "title": "No price filter in search — basic feature gap", "severity": "low", "category": "product", "description": "The search form has property type, date range, and radius but no minimum/maximum price filter. A researcher looking for comparable sales for a £400k property doesn't want £80k flats and £2M detached houses polluting the results. Price banding is standard on every comparable tool.", "location": "resources/views/home.blade.php — filter section", "recommendation": "Add min/max price inputs to the filter row. Wire through SearchFilters DTO and PropertySaleRepository. The scope already supports it via Eloquent whereBetween."}], "stats": {"critical": 3, "high": 6, "medium": 9, "low": 4}}, "review": {"summary": "Propwise is in a pre-launch state with a working data pipeline and API layer but is not ready for public exposure on three axes simultaneously: security posture is poor (no HTTPS, no rate limiting, Telescope open, Redis unprotected), the query layer has a real performance bomb in attachSaleHistory's unbounded OR-query against a 29M-row table, and the product lacks the two features that make property search useful — a map view and price trend charts. The adversarial findings are the most strategically important: without differentiation from Rightmove/Zoopla and without a map, there is no reason for users to choose this product. Security and performance bugs must be fixed before any URL is shared publicly; the product gaps are what determines whether it is worth sharing at all.", "findings": [{"id": "rev-1", "title": "No HTTPS and no rate limiting — do not share any public URL", "severity": "critical", "category": "immediate", "description": "Two security findings combine into a single launch blocker. nginx only listens on HTTP 80, meaning session cookies and all API responses travel in cleartext. There is also zero rate limiting on any endpoint. Given that /api/area-summary triggers up to 24 sequential HTTP calls to data.police.uk and /api/search hits a 29M-row PostGIS table, a single motivated user or a crawler can take down the $12 droplet and exhaust the police API. These two issues mean the app cannot be shared with anyone externally.", "location": "docker/nginx/default.conf, routes/api.php", "recommendation": "1. Point a domain at the droplet and run certbot — this unblocks everything else. 2. Add Laravel throttle middleware to all /api/* routes (e.g. 30/minute per IP). 3. Fix TrustProxies wildcard to the specific DO load balancer IP."}, {"id": "rev-2", "title": "Telescope accessible in production with empty allowlist", "severity": "critical", "category": "immediate", "description": "The Telescope gate has an empty allowlist, meaning anyone who discovers /telescope in production gets full request payloads, SQL queries with bound values, job queues, and exception traces. This is a full application intelligence leak. PROJECT_STATE notes 'Dev only — Gated by local env' but the gate logic is not enforcing this correctly.", "location": "app/Providers/TelescopeServiceProvider.php", "recommendation": "In the gate() callback, return false if app()->environment('production'). Alternatively add APP_ENV check before registering Telescope entirely. Verify by hitting /telescope on the production droplet before any other work."}, {"id": "rev-3", "title": "attachSaleHistory unbounded OR-query — N+1 equivalent at page scale", "severity": "critical", "category": "immediate", "description": "Both QA and adversarial agents flag this. attachSaleHistory builds one OR condition per property on the current page. On PostGIS with 29M rows, combined with no query result caching, the first few concurrent users could produce response times measured in seconds. This is not a theoretical concern — the location UPDATE already demonstrated how slow full-table operations are on this dataset.", "location": "app/Repositories/PropertySaleRepository.php", "recommendation": "Rewrite attachSaleHistory to use a single query with a tuple-in clause or a lateral join. Add a Redis cache layer on the search result (cache by SearchFilters hash, 5-10 minute TTL). This is the highest-effort immediate fix but has the most direct user-facing performance impact."}, {"id": "rev-4", "title": "Redis unprotected and SESSION_ENCRYPT=false", "severity": "high", "category": "immediate", "description": "Redis has no password on the Docker network and sessions are unencrypted. While Docker networking limits exposure compared to a public Redis port, the session store and all cached crime API responses are readable/writable by anything on the same Docker network. If a container is ever compromised, lateral movement to the session store is trivial.", "location": "docker-compose.prod.yml, .env.production.example", "recommendation": "Set requirepass in Redis config and add REDIS_PASSWORD to .env.production.example. Set SESSION_ENCRYPT=true. Both are low-effort .env/config changes."}, {"id": "rev-5", "title": "CrimeDataService — 24 sequential HTTP calls, caches null on failure", "severity": "high", "category": "immediate", "description": "getNeighbourhoodComparison() makes up to 24 sequential calls with no per-call timeout budget, meaning a slow data.police.uk response can hold a PHP-FPM worker for tens of seconds. Cache::remember caches null on API failure, so a transient outage poisons the 7-day cache for all subsequent requests to that neighbourhood. Both QA (qa-5, qa-6) and adversarial (adv-7) agents flag this.", "location": "app/Services/CrimeDataService.php", "recommendation": "1. Add explicit Http::timeout(5) to each police API call. 2. Only cache on successful (non-null) response. 3. Consider making crime-comparison a queued job that writes results to cache, returning a 202 with a polling URL on first call."}, {"id": "rev-6", "title": "No map view — fatal product gap", "severity": "critical", "category": "immediate", "description": "Property search is spatially oriented by nature. Users searching within a 2-mile radius of a postcode need to see where results are relative to each other and the search point. A list of addresses with distances is a degraded experience compared to any free alternative. PROJECT_STATE already lists it as a planned feature; it needs to move to immediate priority. The API already returns distance_metres; coordinates are already in the database.", "location": "resources/js/app.js, resources/views/home.blade.php", "recommendation": "Integrate Leaflet.js. Add lat/lng to PropertySaleResource output. Add a map panel alongside the results list. Pin each result. Mark the search postcode centroid. This is 1-2 days of frontend work with no backend schema changes required."}, {"id": "rev-7", "title": "Verify schools panel does not show stale Ofsted ratings", "severity": "high", "category": "immediate", "description": "Ofsted ratings were removed from GIAS in January 2025. PROJECT_STATE notes they were excluded from import. However, this needs to be verified against what the frontend actually renders. If any Ofsted field is shown in the UI from any source, this is a factual accuracy issue that could cause reputational harm.", "location": "resources/views/home.blade.php, etl/import_schools.py", "recommendation": "Audit what the schools panel actually renders. Grep the frontend templates and API responses for any Ofsted references. If ratings are shown anywhere, remove them immediately."}, {"id": "rev-8", "title": "SAON dropped from address — flats show wrong addresses", "severity": "high", "category": "immediate", "description": "Both QA (qa-3) and adversarial (adv-10) agents catch this. PropertySaleResource silently omits the Secondary Addressable Object Name (flat/unit number). Flats are a significant proportion of urban property sales — the primary use case for this tool. The sale history panel is also unreliable since multiple sales at the same building appear identical.", "location": "app/Http/Resources/PropertySaleResource.php", "recommendation": "Include saon in the address construction, prepending it to paon when non-null: 'Flat 3, 42 Example Street'. Add a test for the flat address format. This is a one-line PHP change."}, {"id": "rev-9", "title": "No test coverage for area-summary and crime-comparison endpoints", "severity": "high", "category": "quick-win", "description": "Both API endpoints that touch the crime data pipeline and schools lookup have zero feature test coverage. Given that these endpoints have the most complex failure modes (HTTP timeouts, null caching, 24 sequential calls), they are the highest-risk code paths with no safety net. This is particularly important before any refactor of CrimeDataService.", "location": "tests/Feature/Api/", "recommendation": "Write feature tests for /api/area-summary and /api/crime-comparison. Mock the CrimeDataService HTTP calls using Http::fake(). Test: successful response shape, police API failure graceful degradation, cached response, invalid postcode 422."}, {"id": "rev-10", "title": "Postcode validation accepts any 8-char string", "severity": "high", "category": "quick-win", "description": "SearchRequest, AreaSummaryController, and CrimeComparisonController all accept any string up to 8 characters as a postcode without format validation. A UK postcode has a well-defined regex. Combined with no rate limiting (rev-1), this is a vector for probing the PostGIS index with arbitrary strings.", "location": "app/Http/Requests/SearchRequest.php, app/Http/Controllers/Api/AreaSummaryController.php, app/Http/Controllers/Api/CrimeComparisonController.php", "recommendation": "Add regex validation rule: /^[A-Z]{1,2}[0-9][0-9A-Z]?\\s?[0-9][A-Z]{2}$/i. Apply in SearchRequest and extract to a shared FormRequest or rule object so all three controllers use the same definition."}, {"id": "rev-11", "title": "sale_date null cast will 500 on dirty LR data", "severity": "medium", "category": "quick-win", "description": "PropertySale casts sale_date as non-nullable Carbon. Land Registry data has known quality issues. A null sale_date in the DB will throw a TypeError when the resource is serialised, producing an unhandled 500 rather than graceful omission.", "location": "app/Models/PropertySale.php, app/Http/Resources/PropertySaleResource.php", "recommendation": "Cast sale_date as ?date (nullable) in the model casts array. In PropertySaleResource, use optional chaining when formatting the date: $this->sale_date?->toDateString(). Add a test case with a null sale_date fixture."}, {"id": "rev-12", "title": "Date range validation silently fails with single date supplied", "severity": "medium", "category": "quick-win", "description": "If only date_from or date_to is supplied without the other, validation passes but the query behaviour is undefined (either ignored or partially applied). Users who supply only one date bound get silently incorrect results.", "location": "app/Http/Requests/SearchRequest.php", "recommendation": "Add required_with validation: date_from requires date_to and vice versa. Or accept single-bound ranges explicitly and document the behaviour. Add tests for each partial-date scenario."}, {"id": "rev-13", "title": "Cache keys use raw float coordinates — unbounded cache key space", "severity": "medium", "category": "quick-win", "description": "Using raw lat/lng floats as cache keys means every unique float pair (including floating point rounding artifacts from PostGIS output) creates a new cache entry. Over time this will bloat Redis memory and make cache hit rates effectively zero for the crime comparison feature.", "location": "app/Services/CrimeDataService.php", "recommendation": "Round coordinates to 4 decimal places (~11m precision) before building cache keys: number_format($lat, 4). One-line fix with significant cache efficiency impact."}, {"id": "rev-14", "title": "Hardcoded fallback password in ETL config", "severity": "medium", "category": "quick-win", "description": "etl/config.py has a hardcoded fallback of 'password' when DB_PASSWORD env var is not set. If the ETL is ever run without the env var set, it will silently use the fallback rather than failing loudly.", "location": "etl/config.py", "recommendation": "Remove the fallback. Use os.environ['DB_PASSWORD'] (raises KeyError on missing) rather than os.environ.get('DB_PASSWORD', 'password'). Fail fast rather than silently connect with wrong credentials."}, {"id": "rev-15", "title": "No price trend / time-series analysis — primary analytics feature missing", "severity": "high", "category": "backlog", "description": "The most analytically compelling feature for a property research tool — seeing how prices in an area have moved over time — is absent. With 29M rows of Land Registry data already loaded, this is a query and visualisation problem, not a data problem. It is what separates a 'property search' tool from a 'property analytics' tool as the name implies.", "location": "app/Repositories/PropertySaleRepository.php, resources/js/app.js", "recommendation": "Add a /api/price-trends endpoint that accepts postcode + radius + property_type and returns median sold price aggregated by quarter for the last 10 years. Render as a Chart.js or lightweight SVG line chart. This is the single feature most likely to give users a reason to use Propwise over Rightmove."}, {"id": "rev-16", "title": "EPC match rate unknown — measure before launch", "severity": "high", "category": "backlog", "description": "EPC matching has not been run against real data yet. Price-per-sqm is the most useful derived metric in the tool; if match rates are low (which is likely for older properties and rural areas), the majority of results will show blank £/sqm, undermining the value proposition.", "location": "etl/match_epc.py, app/Http/Resources/PropertySaleResource.php", "recommendation": "Complete the EPC import and run match_epc.py. Query match rate breakdown: SELECT epc_match_confidence, COUNT(*) FROM property_sales GROUP BY epc_match_confidence. If exact+fuzzy match rate is below 40%, display a note in the UI that floor area data is available where EPC certificates exist."}, {"id": "rev-17", "title": "2-mile radius cap excludes suburban and rural use cases", "severity": "medium", "category": "backlog", "description": "The frontend only offers 0.5/1/2 mile radius options. For users in suburban or rural areas where comparable sales are sparse within 2 miles, this makes the tool return no or very few results. The backend PostGIS query supports any radius; the constraint is purely in the frontend select options.", "location": "resources/views/home.blade.php, app/Http/Requests/SearchRequest.php", "recommendation": "Add 5-mile and 10-mile options to the radius select. Update SearchRequest max validation. Consider adding result count feedback ('3 results — try expanding your radius') to guide users when results are sparse."}, {"id": "rev-18", "title": "No shareable/bookmarkable search URLs", "severity": "medium", "category": "backlog", "description": "The Alpine.js component holds search state in memory only. Users cannot share a specific search or bookmark it for return visits. This is also a prerequisite for any future analytics — without URL state, it is impossible to see what searches users are actually performing.", "location": "resources/js/app.js", "recommendation": "Sync search state to URL query params using URLSearchParams and history.pushState on search submission. Read initial state from URL params on Alpine init. Frontend-only change, no backend impact."}, {"id": "rev-19", "title": "No property detail page — sale history fetched but not rendered", "severity": "medium", "category": "backlog", "description": "The API fetches and returns sale history for each property but the frontend has no property detail view. The sale history data is being computed and transferred but discarded by the UI. This is wasted query work and a missed UX opportunity.", "location": "resources/js/app.js, resources/views/home.blade.php", "recommendation": "Add a slide-out or modal property detail panel triggered by clicking a result row. Display full address (with SAON fix from rev-8), all historical sales, EPC details. Backend work is minimal — data is already in the API response."}, {"id": "rev-20", "title": "Crime data uses incompatible geographies presented as comparable", "severity": "medium", "category": "backlog", "description": "Area-summary uses a 1-mile radius circle for crime counts; crime-comparison uses neighbourhood polygon boundaries. These are fundamentally different geographic units being presented side-by-side as comparable figures. A neighbourhood polygon in a dense urban area may be smaller than the 1-mile radius; in a rural area it may be much larger.", "location": "app/Services/CrimeDataService.php, resources/views/home.blade.php", "recommendation": "Add a disclosure note in the UI explaining that area counts are within 1 mile of the search postcode and neighbourhood counts cover the police neighbourhood polygon (which may differ in size). Longer term, consider using the neighbourhood polygon for both."}, {"id": "rev-21", "title": "git pull in deploy script puts source code on production server", "severity": "medium", "category": "backlog", "description": "The GitHub Actions deploy workflow does a git pull on the production server before building the Docker image. This means the full source code, git history, and any accidentally committed sensitive files live on the production droplet. Image-based deployments should build in CI and push to a registry; the server should only pull the image.", "location": ".github/workflows/deploy.yml", "recommendation": "Move image build to GitHub Actions using docker/build-push-action, push to GHCR or Docker Hub, and have the deploy step only run docker compose pull + up. This eliminates source code on the production server and speeds up deploys."}, {"id": "rev-22", "title": "Product differentiation strategy needed before launch", "severity": "critical", "category": "strategic", "description": "Rightmove, Zoopla, and HouseMetric all offer property history search for free. Propwise as currently described is a subset of what established tools offer. The analytics angle (price trends, £/sqm analysis, time-series charts) is the most defensible differentiator given the data already loaded. Without this clarity, the product roadmap has no north star.", "location": "Strategic / product", "recommendation": "The strongest candidate given existing data: 'The only free tool that shows price-per-sqm trends by property type for any UK area.' This requires price trends (rev-15) and EPC match rate (rev-16) to be completed first."}, {"id": "rev-23", "title": "No auth, no saved searches — no retention mechanism", "severity": "high", "category": "strategic", "description": "With no authentication and no way to save searches or set alerts, there is no mechanism to bring users back. Auth was deferred to Phase 4 but email alerts for price drops or new sales matching a saved search are both a retention mechanism and a natural paywall boundary.", "location": "Strategic / product", "recommendation": "Design the auth and saved-search schema now even if implementation is deferred. Recommended approach: Laravel Sanctum for SPA auth, saved_searches table with filter JSON column, nightly job to check for new matching sales and queue email notifications."}, {"id": "rev-24", "title": "Single $12 droplet not viable beyond demo traffic", "severity": "medium", "category": "strategic", "description": "A $12 DO droplet with 2GB RAM running Postgres (29M rows), Redis, PHP-FPM, nginx, and a scheduler container is adequate for development and low single-digit concurrent users. The PostGIS queries on the property_sales table are memory-intensive; under any real traffic the OOM killer will become an issue.", "location": "docker-compose.prod.yml, Digital Ocean infrastructure", "recommendation": "Before any public launch, move to at minimum a $24 DO droplet (4GB RAM). Evaluate managed Postgres (DO managed DB) to separate the database resource from the application. Add Postgres work_mem and shared_buffers tuning for the PostGIS workload."}, {"id": "rev-25", "title": "Missing security headers and mobile layout", "severity": "low", "category": "backlog", "description": "HSTS, CSP, and Referrer-Policy headers are absent (blocked on SSL being in place first). The frontend has no mobile-optimised layout; property search is increasingly mobile-first behaviour.", "location": "docker/nginx/default.conf, resources/views/layouts/app.blade.php", "recommendation": "After SSL is in place, add HSTS and Referrer-Policy in nginx. Add a basic CSP header. For mobile layout, audit the Tailwind classes on the results table and convert to a card-based layout below the md breakpoint."}], "stats": {"critical": 4, "high": 7, "medium": 8, "low": 1}}};
// ──────────────────────────────────────────────────────────────────────────────

function dashboard() {
  const STORAGE_KEY = 'propwise-review-dismissed';

  const allFindings = [
    ...(RESULTS.qa?.findings || []),
    ...(RESULTS.security?.findings || []),
    ...(RESULTS.adversarial?.findings || []),
    ...(RESULTS.review?.findings || []),
  ];

  const globalStats = { critical: 0, high: 0, medium: 0, low: 0 };
  allFindings.forEach(f => { if (globalStats[f.severity] !== undefined) globalStats[f.severity]++; });

  return {
    activeTab: 'qa',
    activeSeverities: ['critical', 'high', 'medium', 'low'],
    showDismissed: false,
    dismissed: JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'),
    globalStats,
    allFindings,
    totalFindings: allFindings.length,

    tabs: [
      { id: 'qa',          label: 'QA',         icon: '🧪' },
      { id: 'security',    label: 'Security',    icon: '🔒' },
      { id: 'adversarial', label: 'Adversarial', icon: '⚔️' },
      { id: 'review',      label: 'Review',      icon: '📋' },
    ],

    get currentData() {
      return RESULTS[this.activeTab] || null;
    },

    get filteredFindings() {
      if (!this.currentData) return [];
      return this.currentData.findings.filter(f => {
        if (!this.activeSeverities.includes(f.severity)) return false;
        if (!this.showDismissed && this.isDismissed(f.id)) return false;
        return true;
      });
    },

    get addressedItems() {
      return this.allFindings.filter(f => this.isDismissed(f.id));
    },

    tabFindingCount(tabId) {
      const data = RESULTS[tabId];
      if (!data) return '—';
      return data.findings.length;
    },

    isDismissed(id) {
      return !!this.dismissed[id];
    },

    toggleDismiss(id) {
      if (this.dismissed[id]) {
        delete this.dismissed[id];
      } else {
        this.dismissed[id] = true;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this.dismissed));
    },

    clearAll() {
      this.dismissed = {};
      localStorage.removeItem(STORAGE_KEY);
    },

    severityBg(sev) {
      return {
        critical: 'bg-red-900 text-red-300',
        high:     'bg-orange-900 text-orange-300',
        medium:   'bg-yellow-900 text-yellow-300',
        low:      'bg-gray-700 text-gray-300',
      }[sev] || 'bg-gray-700 text-gray-300';
    },

    severityBorder(sev) {
      return {
        critical: 'border-l-4 border-l-red-600',
        high:     'border-l-4 border-l-orange-500',
        medium:   'border-l-4 border-l-yellow-500',
        low:      '',
      }[sev] || '';
    },

    severityDot(sev) {
      return {
        critical: 'bg-red-500',
        high:     'bg-orange-400',
        medium:   'bg-yellow-400',
        low:      'bg-gray-500',
      }[sev] || 'bg-gray-500';
    },

    severityDotText(sev) {
      return {
        critical: 'text-red-500',
        high:     'text-orange-400',
        medium:   'text-yellow-400',
        low:      'text-gray-500',
      }[sev] || 'text-gray-500';
    },
  };
}
</script>
